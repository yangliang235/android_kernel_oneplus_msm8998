name: Build OnePlus5T Kernel with KernelSU-Next

on:
  workflow_dispatch:
  push:
    branches: [ lineage-18.1 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libssl-dev libelf-dev bison flex libncurses-dev git wget zip unzip python3

      - name: Clone KernelSU-Next
        run: |
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          cd KernelSU-Next
          git checkout v3.3.0
          git submodule update --init --recursive

      - name: Integrate KernelSU‑Next into kernel source
        run: |
          export KERNEL_ROOT="$PWD"
          cd KernelSU-Next
          # 重点：在KSU‑Next目录运行 integrate_kernel.sh，传入内核源码路径
          bash scripts/integrate_kernel.sh "${KERNEL_ROOT}"

      - name: Download aarch64‑linux‑gnu‑gcc 4.9 toolchain
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-4.9.git gcc-aarch64
          echo "$PWD/gcc-aarch64/bin" >> $GITHUB_PATH

      - name: Generate defconfig
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make oneplus5_defconfig

      - name: Set KernelSU‑Next config (4.4 NON‑GKI, disable LKM)
        run: |
          ./scripts/config --enable KERNELSU
          ./scripts/config --enable KERNELSU_SU
          ./scripts/config --enable KERNELSU_HIDE
          ./scripts/config --disable KERNELSU_LKM
          ./scripts/config --disable KERNELSU_DEBUG
          make olddefconfig

      - name: Compile kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc)

      - name: Pack Image.gz‑dtb
        run: |
          cp arch/arm64/boot/Image.gz-dtb .
          zip kernel.zip Image.gz-dtb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus5T‑Kernel‑KSU‑Next
          path: kernel.zip
