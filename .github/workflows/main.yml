name: Build OnePlus5T Kernel KSU‑Next (msm8998 4.4 legacy)

on:
  workflow_dispatch:
  push:
    branches: [ lineage-18.1 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps + GCC 4.9 arm64 cross compiler from PPA
        run: |
          sudo apt update
          sudo apt install -y build-essential libssl-dev libelf-dev bison flex libncurses-dev git wget zip unzip curl python3 software-properties-common
          # 添加gcc4.9 PPA
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt update
          sudo apt install -y aarch64-linux-gnu-gcc-4.9 aarch64-linux-gnu-g++-4.9
          # 创建符号链接，让CROSS_COMPILE=aarch64-linux-gnu-指向4.9版本
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-4.9 /usr/bin/aarch64-linux-gnu-gcc
          sudo ln -sf /usr/bin/aarch64-linux-gnu-g++-4.9 /usr/bin/aarch64-linux-gnu-g++

      - name: Integrate KernelSU‑Next legacy mode for Linux4.4 non‑GKI
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v3.3.0/kernel/setup.sh" | bash -s legacy

      - name: Generate base defconfig
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make oneplus5_defconfig

      - name: Set kernel config for KSU‑Next legacy(kprobe mode)
        run: |
          ./scripts/config --enable KERNELSU
          ./scripts/config --enable KERNELSU_SU
          ./scripts/config --enable KERNELSU_HIDE
          ./scripts/config --enable KSU_KPROBE_HOOKS
          ./scripts/config --enable KPROBES
          ./scripts/config --enable KPROBE_EVENTS
          ./scripts/config --disable KERNELSU_LKM
          ./scripts/config --disable KERNELSU_DEBUG
          make olddefconfig

      - name: Compile kernel Image.gz‑dtb
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc)

      - name: Pack kernel zip
        run: |
          cp arch/arm64/boot/Image.gz-dtb .
          zip kernel.zip Image.gz-dtb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus5T‑msm8998‑KSU‑Next‑v3.3.0
          path: kernel.zip
