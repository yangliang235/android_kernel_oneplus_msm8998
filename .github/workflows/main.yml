name: Build OnePlus5T Kernel with KernelSU-Next

on:
  workflow_dispatch:
  push:
    branches: [ lineage-18.1 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libssl-dev libelf-dev bison flex libncurses-dev git wget zip unzip python3

      - name: Clone KernelSU-Next
        run: |
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          cd KernelSU-Next
          git checkout v3.3.0
          # 拉取内核补丁脚本
          git submodule update --init --recursive

      - name: Apply KernelSU-Next patch to kernel
        run: |
          # 进入内核根目录
          export KERNEL_ROOT=$PWD
          cd KernelSU-Next
          # 使用 kpatch 给内核源码打KernelSU-Next补丁（非GKI静态集成）
          bash scripts/kpatch.sh ${KERNEL_ROOT}
        # ⚠️ 如果4.4打补丁失败，会输出冲突，需要手动解决补丁冲突

      - name: Download aarch64‑linux‑gnu‑gcc 交叉工具链
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-4.9.git gcc-aarch64
          echo "$PWD/gcc-aarch64/bin" >> $GITHUB_PATH

      - name: Generate defconfig
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make oneplus5_defconfig

      # 关键：内核配置开启KernelSU-Next相关选项
      - name: Enable KernelSU configs
        run: |
          ./scripts/config --enable KERNELSU
          ./scripts/config --enable KERNELSU_SU
          ./scripts/config --enable KERNELSU_HIDE
          ./scripts/config --disable KERNELSU_LKM
          ./scripts/config --disable KERNELSU_DEBUG
          make olddefconfig

      - name: Compile kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc)

      - name: Pack Image.gz‑dtb
        run: |
          cp arch/arm64/boot/Image.gz-dtb .
          zip kernel.zip Image.gz-dtb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus5T‑Kernel‑KernelSU‑Next
          path: kernel.zip
